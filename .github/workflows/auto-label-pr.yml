name: Auto Label PR
on:
  pull_request:
    types: [opened, edited, synchronize]
jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v7
        id: labeler
        with:
          sync-labels: true

      - if: ${{ !contains(steps.labeler.outputs.all-labels, 'no-changelog') }}
        uses: actions/github-script@v9
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const issue_number = pullRequest.number;

            const prefixToLabel = {
              'feat': 'enhancement',
              'fix': 'bug',
              'chore': 'chore',
              'build': 'chore',
              'ci': 'chore',
              'docs': 'documentation',
              'perf': 'enhancement',
            };

            // Conventional Commits marks a breaking change with `!` before the
            // colon, or with a `BREAKING CHANGE:` footer.
            const breakingHeader = /^\w+(\([^)]*\))?!:/;
            const breakingFooter = /^BREAKING[ -]CHANGE:/m;

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner,
              repo,
              pull_number: issue_number,
              per_page: 100,
            });

            const isBreaking =
              breakingHeader.test(pullRequest.title) ||
              commits.some(
                (commit) =>
                  breakingHeader.test(commit.commit.message) ||
                  breakingFooter.test(commit.commit.message),
              );

            const labels = [];

            const match = pullRequest.title.match(/^(\w+)(\(.+\))?!?:/);
            if (match && prefixToLabel[match[1]]) {
              labels.push(prefixToLabel[match[1]]);
            }

            if (isBreaking) {
              labels.push('breaking');
            }

            if (labels.length > 0) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels });
            }

            const hasBreakingLabel = pullRequest.labels.some(
              (label) => label.name === 'breaking',
            );

            if (!isBreaking && hasBreakingLabel) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number,
                  name: 'breaking',
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
