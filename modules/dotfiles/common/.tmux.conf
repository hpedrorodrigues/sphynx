# References:
# - https://github.com/tmux/tmux/wiki/Getting-Started
# - https://tmuxcheatsheet.com

### General

# Enable mouse support
set -g mouse on

# Address vim mode switching delay
# http://superuser.com/a/252717/65504
set -s escape-time 0

# Increase scrollback buffer size
set -g history-limit 98304

# Enable focus events for terminals that support them
set -g focus-events on

# Keep 24-bit colour in terminals whose terminfo lacks RGB (VS Code, Zed)
set -as terminal-features ",xterm-256color:RGB"

# Let extended keys (kitty keyboard protocol) from Ghostty reach applications
set -s extended-keys on
set -as terminal-features ",xterm-ghostty:extkeys"

# Set the terminal title from the session, window, and pane
set-option -g set-titles on

# Renumber windows sequentially after closing any of them
set -g renumber-windows on

# Use vi key bindings
set-window-option -g mode-keys vi

### Keys

# Set prefix as Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Use the same directory when creating a new window
unbind c
bind c new-window -c "#{pane_current_path}"

# Use | and - to split a window vertically and horizontally instead of " and % respectively
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Switch between panes using alt + arrow
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Use shift + left/right to move the current window left/right in the status bar
bind -n S-Left  if -F '#{window_start_flag}' '' 'swap-window -d -t -1'
bind -n S-Right if -F '#{window_end_flag}'   '' 'swap-window -d -t +1'

# Use cmd+option + left/right to switch between windows (similar to Chrome tabs)
# (Ghostty maps cmd+opt+arrows to shift+alt arrow sequences, see modules/settings/macos/ghostty/config)
bind -n S-M-Left  previous-window
bind -n S-M-Right next-window

# Use a to toggle synchronize panes
bind a set-window-option synchronize-panes

# Prefix + \ to search up
bind-key \\ copy-mode \; send-key ?

# Prefix + / to search down
bind-key / copy-mode \; send-key /

# Use r to quickly reload tmux settings
unbind r
bind r source-file ~/.tmux.conf \; display 'Reloaded tmux config'

# Prefix + k to clear both screen and history
unbind k
bind k send-keys C-l \; run 'sleep 0.1' \; clear-history

### Plugins

#### Customizations

##### Dracula
##### https://draculatheme.com/tmux
##### https://github.com/dracula/tmux
set -g @dracula-show-powerline true
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session
set -g @dracula-military-time true
set -g @dracula-show-fahrenheit false
set -g @dracula-plugins 'battery network weather time'
##### One IP instead of three hostnames pinged every refresh
set -g @dracula-network-hosts '1.1.1.1'
##### Change the selection color to match Dracula theme
set-window-option -g mode-style "fg=#282a36,bg=#8be9fd"

#### Loading plugins

##### Specifying plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'dracula/tmux'

##### Loading TMUX plugin manager (keep this line at the very bottom of tmux.conf)
##### https://github.com/tmux-plugins/tpm
run '~/.tmux/plugins/tpm/tpm'
