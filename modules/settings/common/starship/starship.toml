"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$kubernetes\
$aws\
$gcloud\
$cmd_duration\
$line_break\
$jobs\
$character
"""

palette = "dracula-like"

[palettes.dracula-like]
green = "#50fa7b"
cyan = "#8be9fd"
orange = "#ffb86c"
purple = "#bd93f9"

[username]
show_always = true
format = "╭─[$user]($style)"
style_user = "bold white"

[hostname]
ssh_only = false
format = "@[$hostname]($style) "
style = "white"

[directory]
truncation_length = 7
truncate_to_repo = false
truncation_symbol = "…/"
style = "bold white"

[git_branch]
format = "[$symbol$branch]($style) "
style = "green"

[git_commit]
commit_hash_length = 5
only_detached = false
style = "green"

[git_status]
style = "green"

[kubernetes]
disabled = false
symbol = "☸ "
format = "[$symbol$context(\\($namespace\\))]($style) "
style = "cyan"
contexts = [
  { context_pattern = "^gke_[^_]+_[^_]+_(?P<cluster>[\\w-]+)$", context_alias = "gke-$cluster" },
]

[aws]
symbol = "❄ "
format = "[$symbol$profile(\\($region\\))]($style) "
style = "orange"

[gcloud]
symbol = "☀ "
format = "[$symbol$project(\\($region\\))]($style) "
style = "purple"

[cmd_duration]
min_time = 5_000
format = "[$duration]($style) "
style = "bright-red"

[character]
success_symbol = "[♪](bold green)"
error_symbol = "[✗](bold red)"
vimcmd_symbol = "[ⓥ](bold yellow)"
