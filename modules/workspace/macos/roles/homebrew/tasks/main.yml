- name: Checking /usr/local/bin directory
  stat:
    path: '/usr/local/bin'
  register: local_bin

- name: Moving all /usr/local/bin content to /opt/homebrew/bin
  shell: 'mv /usr/local/bin/* /opt/homebrew/bin/ || true'
  become: true
  when:
    - local_bin.stat.islnk is not defined
    - ansible_facts["architecture"] == 'arm64'
    - ansible_facts["os_family"] == 'Darwin'

- name: Creating symbolic link from /usr/local/bin to /opt/homebrew/bin
  file:
    src: '/opt/homebrew/bin'
    dest: '/usr/local/bin'
    state: link
    force: true
  become: true
  when:
    - local_bin.stat.islnk is not defined
    - ansible_facts["architecture"] == 'arm64'
    - ansible_facts["os_family"] == 'Darwin'

- name: Tapping repositories
  community.general.homebrew_tap:
    name: '{{ item }}'
    state: present
  loop: '{{ repositories }}'

- name: Updating Homebrew
  community.general.homebrew:
    update_homebrew: true

- name: Upgrading all formulas
  community.general.homebrew:
    upgrade_all: true

- name: Upgrading all casks
  community.general.homebrew_cask:
    upgrade_all: true

- name: Installing Homebrew formulas
  community.general.homebrew:
    name: '{{ formulas }}'
    state: present

- name: Installing Homebrew casks
  community.general.homebrew_cask:
    name: '{{ casks }}'
    state: present

- name: Removing formulas that are no longer needed as dependencies
  command: brew autoremove
  register: brew_autoremove
  changed_when: '"Autoremoving" in brew_autoremove.stdout'

- name: Cleaning up old versions, caches, and broken symbolic links
  command: brew cleanup
  register: brew_cleanup
  changed_when: brew_cleanup.stdout | length > 0
