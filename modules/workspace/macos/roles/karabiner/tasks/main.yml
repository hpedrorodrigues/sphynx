- name: Installing Karabiner Elements
  community.general.homebrew_cask:
    name: karabiner-elements
    state: present

- name: Creating configuration directory
  file:
    path: '{{ ansible_facts["user_dir"] }}/.config'
    state: directory

- name: Checking existing settings directory
  stat:
    path: '{{ ansible_facts["user_dir"] }}/.config/karabiner'
  register: karabiner_directory

- name: Moving existing settings directory to a backup
  command:
    argv:
      - mv
      - '{{ ansible_facts["user_dir"] }}/.config/karabiner'
      - '{{ ansible_facts["user_dir"] }}/.config/karabiner.backup-{{ ansible_facts["date_time"]["epoch"] }}'
  when: karabiner_directory.stat.isdir | default(false)

- name: Installing personal settings
  file:
    src: '{{ sphynx_settings_directory }}/macos/karabiner-elements'
    dest: '{{ ansible_facts["user_dir"] }}/.config/karabiner'
    state: link
    force: yes
  notify:
    - Restart Karabiner Elements
